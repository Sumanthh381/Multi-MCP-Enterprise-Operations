[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-operations-copilot"
version = "1.0.0"
description = "Evidence-grounded enterprise operations through two MCP servers"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26,<2", "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "scikit-learn>=1.6", "numpy>=2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy", "playwright", "pip-audit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["enterprise"]
relative_files = true
patch = ["subprocess"]
sigterm = true
